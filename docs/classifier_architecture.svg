<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="'Segoe UI', 'Noto Sans', sans-serif">
  <defs>
    <style>
      .box { rx: 6; ry: 6; stroke-width: 1.5; }
      .input { fill: #1f2335; stroke: #7aa2f7; }
      .fine { fill: #1f2335; stroke: #9ece6a; }
      .broad { fill: #1f2335; stroke: #bb9af7; }
      .merge { fill: #1f2335; stroke: #ff9e64; }
      .output { fill: #1f2335; stroke: #7aa2f7; }
      .label { fill: #c0caf5; font-size: 13px; text-anchor: middle; }
      .sublabel { fill: #787c99; font-size: 11px; text-anchor: middle; }
      .legend-text { fill: #a9b1d6; font-size: 11px; text-anchor: start; }
      .branch-label { font-size: 12px; font-weight: bold; text-anchor: middle; }
      .fine-label { fill: #9ece6a; }
      .broad-label { fill: #bb9af7; }
      .merge-label { fill: #ff9e64; }
      .arrow { stroke: #545c7e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-fine { stroke: #9ece6a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-fine); }
      .arrow-broad { stroke: #bb9af7; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-broad); }
      .arrow-merge { stroke: #ff9e64; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-merge); }
      .title { fill: #e0e4f7; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#545c7e" />
    </marker>
    <marker id="arrowhead-fine" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#9ece6a" />
    </marker>
    <marker id="arrowhead-broad" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#bb9af7" />
    </marker>
    <marker id="arrowhead-merge" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ff9e64" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="640" fill="#1a1b26" rx="10" />

  <!-- Title -->
  <text x="360" y="35" class="title">Dual-Branch 1D CNN Classifier</text>

  <!-- Input -->
  <rect x="235" y="50" width="250" height="40" class="box input" />
  <text x="360" y="73" class="label">Input (301, 1)</text>
  <text x="360" y="105" class="sublabel">Min-max normalised spectrum</text>

  <!-- Split arrows -->
  <path d="M300,90 L300,90 L220,130" class="arrow-fine" />
  <path d="M420,90 L420,90 L500,130" class="arrow-broad" />

  <!-- Fine branch label -->
  <text x="220" y="145" class="branch-label fine-label">Fine branch (kernel=5)</text>

  <!-- Fine Conv Block 1 -->
  <rect x="110" y="155" width="220" height="36" class="box fine" />
  <text x="220" y="171" class="label" font-size="11">Conv1D(32, k=5) → BN → ReLU</text>
  <text x="220" y="183" class="sublabel" font-size="10">MaxPool(2) → (150, 32)</text>

  <line x1="220" y1="191" x2="220" y2="210" class="arrow-fine" />

  <!-- Fine Conv Block 2 -->
  <rect x="110" y="210" width="220" height="36" class="box fine" />
  <text x="220" y="226" class="label" font-size="11">Conv1D(32, k=5) → BN → ReLU</text>
  <text x="220" y="238" class="sublabel" font-size="10">MaxPool(2) → (75, 32)</text>

  <!-- Broad branch label -->
  <text x="500" y="145" class="branch-label broad-label">Broad branch (kernel=21)</text>

  <!-- Broad Conv Block 1 -->
  <rect x="390" y="155" width="220" height="36" class="box broad" />
  <text x="500" y="171" class="label" font-size="11">Conv1D(32, k=21) → BN → ReLU</text>
  <text x="500" y="183" class="sublabel" font-size="10">MaxPool(2) → (150, 32)</text>

  <line x1="500" y1="191" x2="500" y2="210" class="arrow-broad" />

  <!-- Broad Conv Block 2 -->
  <rect x="390" y="210" width="220" height="36" class="box broad" />
  <text x="500" y="226" class="label" font-size="11">Conv1D(32, k=21) → BN → ReLU</text>
  <text x="500" y="238" class="sublabel" font-size="10">MaxPool(2) → (75, 32)</text>

  <!-- Merge arrows -->
  <path d="M220,246 L220,280 L360,300" class="arrow-fine" />
  <path d="M500,246 L500,280 L360,300" class="arrow-broad" />

  <!-- Concatenate -->
  <rect x="260" y="300" width="200" height="32" class="box merge" />
  <text x="360" y="320" class="label" font-size="12">Concatenate → (75, 64)</text>

  <line x1="360" y1="332" x2="360" y2="355" class="arrow-merge" />

  <!-- Merged Conv Block -->
  <rect x="220" y="355" width="280" height="36" class="box merge" />
  <text x="360" y="371" class="label" font-size="11">Conv1D(64, k=5) → BN → ReLU</text>
  <text x="360" y="383" class="sublabel" font-size="10">MaxPool(2) → (37, 64)</text>

  <line x1="360" y1="391" x2="360" y2="414" class="arrow" />

  <!-- GAP -->
  <rect x="245" y="414" width="230" height="32" class="box output" />
  <text x="360" y="434" class="label" font-size="12">GlobalAveragePooling1D → (64,)</text>

  <line x1="360" y1="446" x2="360" y2="469" class="arrow" />

  <!-- Dropout -->
  <rect x="275" y="469" width="170" height="32" class="box output" />
  <text x="360" y="489" class="label" font-size="12">Dropout(0.3)</text>

  <line x1="360" y1="501" x2="360" y2="524" class="arrow" />

  <!-- Output -->
  <rect x="265" y="524" width="190" height="40" class="box output" />
  <text x="360" y="543" class="label" font-size="12">Dense(1, sigmoid)</text>
  <text x="360" y="558" class="sublabel" font-size="11">P ∈ [0, 1]</text>

  <!-- Legend -->
  <rect x="20" y="580" width="12" height="12" fill="#9ece6a" rx="2" />
  <text x="40" y="591" class="legend-text">Fine features (peaks, artifacts)</text>
  <rect x="20" y="598" width="12" height="12" fill="#bb9af7" rx="2" />
  <text x="40" y="609" class="legend-text">Broad features (peak spacing, structure)</text>
  <rect x="20" y="616" width="12" height="12" fill="#ff9e64" rx="2" />
  <text x="40" y="627" class="legend-text">Merged representation</text>
</svg>
