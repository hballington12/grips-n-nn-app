name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: GRIPSSpectraViewer-linux
          - os: macos-15
            artifact: GRIPSSpectraViewer-macos-arm64
          - os: windows-latest
            artifact: GRIPSSpectraViewer-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      # Linux CI runners are headless — install the OpenGL/EGL libs
      # that PyQt6 links against at build time.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx

      - name: Install dependencies
        run: uv sync --dev

      - name: Build with PyInstaller
        run: uv run pyinstaller grips-app.spec --noconfirm

      # --- macOS: create a .dmg from the .app bundle ---
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          # Remove quarantine attribute so the .app isn't flagged
          xattr -cr dist/GRIPSSpectraViewer.app
          hdiutil create -volname "GRIPS Spectra Viewer" \
            -srcfolder dist/GRIPSSpectraViewer.app \
            -ov -format UDZO \
            dist/GRIPSSpectraViewer.dmg

      # --- Upload per-platform artifacts ---
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GRIPSSpectraViewer/

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GRIPSSpectraViewer.dmg

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GRIPSSpectraViewer/

  # Separate job for Ubuntu 20.04 (glibc 2.31) — runs inside a Docker
  # container since GitHub no longer offers a native 20.04 runner.
  build-linux-legacy:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4

      # ubuntu:20.04 is minimal — install essentials + PyQt6 system deps
      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl \
            build-essential libegl1 libgl1-mesa-glx libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python and install deps
        run: |
          uv python install 3.11
          # PyQt6-Qt6 v6.10+ only ships manylinux_2_34 wheels.
          # Pin to 6.9.x which still has manylinux_2_28 (glibc 2.28).
          # Patch pyproject.toml to add the constraint before resolving.
          printf '\n[tool.uv]\noverride-dependencies = ["pyqt6-qt6<6.10"]\n' >> pyproject.toml
          uv sync --dev

      - name: Build with PyInstaller
        run: uv run pyinstaller grips-app.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRIPSSpectraViewer-linux-legacy
          path: dist/GRIPSSpectraViewer/
          retention-days: 30

  release:
    needs: [build, build-linux-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts
        run: |
          cd artifacts

          # Linux (glibc 2.35+): tar.gz
          tar -czf GRIPSSpectraViewer-linux.tar.gz \
            -C GRIPSSpectraViewer-linux .

          # Linux legacy (glibc 2.31+, Ubuntu 20.04 compatible): tar.gz
          tar -czf GRIPSSpectraViewer-linux-legacy.tar.gz \
            -C GRIPSSpectraViewer-linux-legacy .

          # macOS: DMG is already a single file
          cp GRIPSSpectraViewer-macos-arm64/GRIPSSpectraViewer.dmg \
            GRIPSSpectraViewer-macos-arm64.dmg

          # Windows: zip
          cd GRIPSSpectraViewer-windows && zip -r \
            ../GRIPSSpectraViewer-windows.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GRIPSSpectraViewer-linux.tar.gz
            artifacts/GRIPSSpectraViewer-linux-legacy.tar.gz
            artifacts/GRIPSSpectraViewer-macos-arm64.dmg
            artifacts/GRIPSSpectraViewer-windows.zip
          generate_release_notes: true
